<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<title>GS1 Scan2Trust · Test codes</title>
<style>
:root{--blue:#002C6C;--orange:#F26334;--ok:#22a06b;--warn:#e6a700;--bad:#d9534f;--ink:#1a1a1a;--grey:#5b6b7d}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{font-family:"Segoe UI",Arial,Helvetica,sans-serif;color:#fff;min-height:100vh;background:radial-gradient(1200px 700px at 15% -10%,#0d56b8 0,#002C6C 48%,#001535 100%) #001535}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 22px;background:rgba(0,21,53,.92);backdrop-filter:blur(8px);border-bottom:3px solid var(--orange)}
header img{height:38px;background:#fff;border-radius:50%;padding:3px}
.brand b{display:block;font-size:17px;line-height:1.1}.brand span{font-size:11.5px;opacity:.75;letter-spacing:.8px;text-transform:uppercase}
.hsp{flex:1}
.lang{display:flex;border:1px solid rgba(255,255,255,.25);border-radius:8px;overflow:hidden}
.lang button{background:none;border:none;color:#fff;opacity:.6;padding:6px 11px;font-weight:700;cursor:pointer;font-family:inherit}
.lang button.on{background:#fff;color:var(--blue);opacity:1}
main{max-width:1240px;margin:0 auto;padding:30px 24px 60px;display:flex;flex-direction:column;gap:38px}
.kicker{display:inline-block;background:rgba(242,99,52,.18);color:#ffc2ab;border:1px solid rgba(242,99,52,.45);border-radius:20px;padding:5px 14px;font-size:12.5px;font-weight:800;letter-spacing:.7px;text-transform:uppercase}
h1{font-size:clamp(30px,4vw,52px);font-weight:800;line-height:1.08;letter-spacing:-.6px;margin:14px 0 12px}
h1 em{font-style:normal;color:var(--orange)}
.lead{font-size:clamp(16px,1.5vw,20px);opacity:.92;max-width:900px;line-height:1.5}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.chips a{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);border-radius:20px;padding:8px 16px;font-weight:700;font-size:14px}
.chips a:hover{background:#fff;color:var(--blue)}
h2{font-size:clamp(22px,2.2vw,30px);display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:3px solid var(--orange);margin-bottom:16px}
.sd{opacity:.85;max-width:900px;line-height:1.5;margin-bottom:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs button{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:#fff;border-radius:20px;padding:8px 16px;font-weight:800;cursor:pointer;font-family:inherit}
.tabs button.on{background:#fff;color:var(--blue)}
.tabs .sw{margin-left:auto}
.tip{font-size:13px;opacity:.8;margin-bottom:12px}
.tcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.tcg.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.tcg.big{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.tcg .tsec{grid-column:1/-1;font-weight:800;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:#ffc2ab;border-bottom:2px solid rgba(242,99,52,.55);padding:4px 2px;margin-top:8px}
.tc{background:#fff;color:var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;cursor:zoom-in;border-top:7px solid #c8d1dc;transition:transform .15s}
.tc:hover{transform:translateY(-3px)}
.tcg.ans .tc.ok{border-top-color:var(--ok)}.tcg.ans .tc.warn{border-top-color:var(--warn)}.tcg.ans .tc.bad{border-top-color:var(--bad)}
.tc .qi svg{display:block;width:100%;height:auto}
.tc .bi{height:90px}.tc .bi svg{display:block}
.tc .hri{font-family:Consolas,monospace;font-size:12px;text-align:center;word-break:break-all}
.tc b{font-size:14px;color:var(--blue)}
.tc i{font-style:normal;font-size:12px;color:var(--grey);line-height:1.4}
.tc code{font-family:Consolas,monospace;font-size:10.5px;color:var(--grey);word-break:break-all}
.tc .tl{font-weight:900;color:var(--blue);font-size:15px}
.tcg:not(.ans) .tc .an{display:none}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.shot{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:zoom-in;text-align:center}
.shot .ph{background:#0d0d0d;border-radius:24px;padding:6px;box-shadow:0 10px 26px rgba(0,0,0,.35);width:100%;max-width:210px;transition:transform .2s}
.shot:hover .ph{transform:translateY(-4px)}
.shot .ph.err{box-shadow:0 0 0 3px var(--bad),0 10px 26px rgba(0,0,0,.35)}
.shot .ph img{display:block;width:100%;border-radius:18px;aspect-ratio:945/1560;object-fit:cover;object-position:top}
.shot b{font-size:14px}.shot span{font-size:12px;opacity:.8;line-height:1.35}
.dsec{font-weight:800;font-size:13px;letter-spacing:.8px;text-transform:uppercase;margin:6px 0 12px;color:#9df0c6}.dsec.e{color:#ff9b97;margin-top:26px}
.apps{display:flex;gap:28px;flex-wrap:wrap}
.store{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}
.store .qbox{background:#fff;border-radius:14px;padding:10px;width:190px;cursor:zoom-in}
.store .qbox svg{display:block;width:100%;height:auto}
.store a{color:#ffc2ab;font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,20,50,.88);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.ov.show{display:flex}
.zoom{position:relative;background:#fff;border-radius:22px;padding:26px 22px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--blue);max-height:96vh;overflow:auto}
.zx{position:absolute;top:8px;right:10px;background:#eef1f5;border:none;border-radius:50%;width:32px;height:32px;cursor:pointer;color:var(--blue);font-size:14px}
.zoom .zq{width:min(72vh,86vw)}.zoom .zq svg{display:block;width:100%;height:auto}
.zoom .zq.wide{height:min(36vh,300px);width:min(90vw,1100px)}.zoom .zq.wide svg{height:100%}
.zoom .zq img{display:block;height:min(80vh,900px);width:auto;max-width:80vw;border-radius:18px;margin:0 auto}
.zoom .zt{font-family:Consolas,monospace;font-size:13px;color:var(--grey);word-break:break-all;max-width:80vw;text-align:center}
.zoom .zt b{display:block;font-family:"Segoe UI",Arial,sans-serif;font-size:16px;color:var(--blue);margin-bottom:4px}
footer{font-size:12.5px;opacity:.7;line-height:1.6;border-top:1px solid rgba(255,255,255,.2);padding-top:18px}
footer a{color:#ffc2ab}
@media(max-width:640px){main{padding:22px 14px 50px}header{padding:8px 12px}.tabs .sw{margin-left:0}}

</style>
</head>

<script>
const QR = (()=>{
  const ECC=[-1,10,16,26,18,24,16,18,22,22,26,30,22,22,24,24,28,28,26,26,26,26,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28,28];
  const BLK=[-1,1,1,1,2,2,4,4,4,5,5,5,8,9,9,10,10,11,13,14,16,17,17,18,20,21,23,25,26,28,29,31,33,35,37,38,40,43,45,47,49];
  const bit=(x,i)=>((x>>>i)&1)!==0;
  const raw=v=>{ let r=(16*v+128)*v+64; if(v>=2){ const n=Math.floor(v/7)+2; r-=(25*n-10)*n-55; if(v>=7) r-=36; } return r; };
  const dataCw=v=>Math.floor(raw(v)/8)-ECC[v]*BLK[v];
  const mul=(x,y)=>{ let z=0; for(let i=7;i>=0;i--){ z=(z<<1)^((z>>>7)*0x11D); z^=((y>>>i)&1)*x; } return z&0xFF; };
  const rsDiv=d=>{ const r=new Array(d).fill(0); r[d-1]=1; let root=1; for(let i=0;i<d;i++){ for(let j=0;j<r.length;j++){ r[j]=mul(r[j],root); if(j+1<r.length) r[j]^=r[j+1]; } root=mul(root,2); } return r; };
  const rsRem=(data,div)=>{ const r=div.map(()=>0); for(const b of data){ const f=b^r.shift(); r.push(0); div.forEach((c,i)=>r[i]^=mul(c,f)); } return r; };
  const alignPos=v=>{ if(v===1) return []; const n=Math.floor(v/7)+2, size=v*4+17; const step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2; const r=[6]; for(let p=size-7;r.length<n;p-=step) r.splice(1,0,p); return r; };
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(text));
    let ver=1; for(;ver<=40;ver++){ const cc=ver<=9?8:16; if(4+cc+bytes.length*8<=dataCw(ver)*8) break; }
    if(ver>40) throw new Error("QR: data too long");
    const cap=dataCw(ver)*8, bb=[]; const push=(val,len)=>{ for(let i=len-1;i>=0;i--) bb.push((val>>>i)&1); };
    push(4,4); push(bytes.length,ver<=9?8:16); bytes.forEach(b=>push(b,8));
    push(0,Math.min(4,cap-bb.length)); push(0,(8-bb.length%8)%8);
    for(let p=0xEC;bb.length<cap;p^=0xEC^0x11) push(p,8);
    const data=[]; for(let i=0;i<bb.length;i+=8){ let b=0; for(let j=0;j<8;j++) b=(b<<1)|bb[i+j]; data.push(b); }
    // ECC + interleave
    const nb=BLK[ver], el=ECC[ver], rc=Math.floor(raw(ver)/8), ns=nb-rc%nb, sl=Math.floor(rc/nb), div=rsDiv(el), blocks=[];
    for(let i=0,k=0;i<nb;i++){ const d=data.slice(k,k+sl-el+(i<ns?0:1)); k+=d.length; const e=rsRem(d,div); if(i<ns) d.push(0); blocks.push(d.concat(e)); }
    const cw=[]; for(let i=0;i<blocks[0].length;i++) blocks.forEach((b,j)=>{ if(i!==sl-el||j>=ns) cw.push(b[i]); });
    // matrix
    const size=ver*4+17, M=[...Array(size)].map(()=>Array(size).fill(false)), F=[...Array(size)].map(()=>Array(size).fill(false));
    const setF=(x,y,d)=>{ M[y][x]=d; F[y][x]=true; };
    for(let i=0;i<size;i++){ setF(6,i,i%2===0); setF(i,6,i%2===0); }

/* ---------- code rendering ---------- */
function svgOf(x,kind){ try{
  if(kind==="ean") return BC.bars(BC.ean13(x.v),{quiet:9});
  if(kind==="c128") return BC.bars(BC.code128(x.v,!x.plain),{quiet:10});
  if(kind==="dm") return BC.dmSvg(x.v,x.gs1!==undefined?x.gs1:!x.plain);
  return QR.svg(x.v);
 }catch(e){ return `<div style="color:#c00">${esc(e.message)}</div>`; } }
function card(x,i,kind,reg){ const img=svgOf(x,kind), wide=kind==="ean"||kind==="c128"; reg.push({x,kind});
  const box=wide?`<div class="bi">${img}</div><div class="hri">${esc(x.h||x.v)}</div>`:`<div class="qi">${img}</div>`;
  return `<div class="tc ${x.k}" data-c="${reg.length-1}">${box}<span class="tl">#${i+1}</span><span class="an"><b>${x.ico} ${esc(L(x.t))}</b></span>${(kind==="qr"||kind==="dm")?`<code class="an">${esc(x.h||x.v)}</code>`:""}${x.r?`<code class="an" style="color:var(--bad);font-weight:700">${LANG==="de"?"Scanner liest: ":"Scanner reads: "}${esc(x.r)}</code>`:""}<i class="an">${esc(L(x.x))}</i></div>`; }
let REG=[];
function zoomCode(r){ const x=r.x, wide=r.kind==="ean"||r.kind==="c128";
  $("zq").className="zq"+(wide?" wide":""); $("zq").innerHTML=svgOf(x,r.kind);
  $("zt").innerHTML=(TC_ANS||r.demo?`<b>${x.ico} ${esc(L(x.t))}</b>${esc(x.h||x.v)}`:""); $("zoomOv").classList.add("show"); }
function zoomShot(i){ const x=SHOTS[i]; $("zq").className="zq"; $("zq").innerHTML=`<img src="${x.src}" alt="">`; $("zt").innerHTML=`<b>${esc(L(x.t))}</b>${esc(L(x.d))}`; $("zoomOv").classList.add("show"); }

  const sh=(x,i)=>`<div class="shot" data-s="${i}"><div class="ph ${x.err?"err":""}"><img loading="lazy" src="${x.src}" alt=""></div><b>${esc(L(x.t))}</b><span>${esc(L(x.d))}</span></div>`;
  const ok=SHOTS.map((x,i)=>[x,i]).filter(a=>!a[0].err), er=SHOTS.map((x,i)=>[x,i]).filter(a=>a[0].err);
  $("sec-shots").innerHTML=`<h2>📸 ${de?"Was die App zeigt":"What the app shows"}</h2><p class="sd">${de?"Beispiel-Screenshots der App (iOS).":"Example screenshots of the app (iOS)."}</p>
   <div class="dsec">✅ ${de?"Gültiger Code":"Valid code"}</div><div class="shots">${ok.map(a=>sh(a[0],a[1])).join("")}</div>
   <div class="dsec e">⚠️ ${de?"Fehlerhafte Codes":"Faulty codes"}</div><div class="shots">${er.map(a=>sh(a[0],a[1])).join("")}</div>`;
  $("sec-shots").onclick=e=>{ const c=e.target.closest("[data-s]"); if(c) zoomShot(+c.dataset.s); }; }
function drawApp(){ const de=LANG==="de"; const sec=$("sec-app");
  if(!SHOW_APP_LINKS){ sec.innerHTML=""; return; }
  const q=u=>{ try{ return QR.svg(u); }catch(_){ return ""; } };
  sec.innerHTML=`<h2>📲 ${de?"App":"App"}</h2><p class="sd">${de?"Zum Testen der Codes: GS1 Scan2Trust aus dem Store laden und die Codes oben scannen.":"To try the codes: get GS1 Scan2Trust from the store and scan the codes above."}</p>
   <div class="apps"><div class="store"><div class="qbox" data-u="${esc(LINKS.ios)}">${q(LINKS.ios)}</div>🍏 App Store<a href="${LINKS.ios}" target="_blank" rel="noopener noreferrer">${de?"Link öffnen ↗":"Open link ↗"}</a></div>
   <div class="store"><div class="qbox" data-u="${esc(LINKS.android)}">${q(LINKS.android)}</div>🤖 Google Play<a href="${LINKS.android}" target="_blank" rel="noopener noreferrer">${de?"Link öffnen ↗":"Open link ↗"}</a></div></div>`;
  sec.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>zoomPlain(b.dataset.u)); }
function drawStatic(){ const de=LANG==="de";
  document.documentElement.lang=LANG;
  $("sub").textContent=de?"Testcodes":"Test codes";
  $("kick").textContent=de?"Nur Test- und Demodaten":"Test & demo data only";
  $("h1").innerHTML=de?"Demo- &amp; <em>Testcodes</em>":"Demo &amp; <em>test codes</em>";
  $("lead").textContent=de?"QR-Codes mit GS1 Digital Link, EAN-13, GS1-128 und GS1 DataMatrix zum Ausprobieren mit der GS1 Scan2Trust App. Alle Daten sind fiktiv.":"QR codes with GS1 Digital Link, EAN-13, GS1-128 and GS1 DataMatrix to try out with the GS1 Scan2Trust app. All data is fictitious.";
  $("chips").innerHTML=`<a href="#sec-demo">${de?"Demo-Produkte":"Demo products"}</a><a href="#sec-codes">${de?"Testcodes":"Test codes"}</a><a href="#sec-shots">${de?"Screenshots":"Screenshots"}</a>${SHOW_APP_LINKS?`<a href="#sec-app">App</a>`:""}`;
  $("foot").innerHTML=de?`Reine Demo- und Testdaten, keine echten Produkte. Mehr zu Scan2Trust: <a href="${LINKS.web}" target="_blank" rel="noopener noreferrer">gs1-germany.de</a>.`:`Demo and test data only – no real products. More about Scan2Trust: <a href="${LINKS.web}" target="_blank" rel="noopener noreferrer">gs1-germany.de</a>.`;
  document.querySelectorAll("#langSw button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG)); }
function drawAll(){ drawStatic(); drawDemo(); drawCodes(); drawShots(); drawApp(); }
function closeZoom(){ $("zoomOv").classList.remove("show"); }
$("langSw").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; LANG=b.dataset.l; drawAll(); };
$("zoomOv").onclick=e=>{ if(e.target===$("zoomOv")) closeZoom(); };
$("zx").onclick=closeZoom;
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeZoom(); });
drawAll();

</script>
</body>
</html>
